# Live/competition engine settings for the RXM bridge (src/strategy_bridge).
# Every key is a field of src/engine/config/settings.py::ExecutionConfig (extra keys are rejected).
# config/default.yaml is untouched. Load with src.strategy_bridge.load_competition_config().
# Sized for a ~$100k Roostoo account (backtest initial_cash). See docs/LIVE_RUNBOOK.md.
quote_currency: USD
supports_shorting: true
supports_leverage: false
supports_limit_orders: true
supports_stop_orders: false
live_mode: false            # NEVER true in this file. The live runner must set it explicitly.
dry_run: true               # the mock demo overrides to false (MOCK port only)
spot_limit_fee: 0.0005
spot_market_fee: 0.001
short_open_fee: 0.001
short_close_fee: 0.001
no_trade_band_pct: 0.01     # same 1% band as the backtest (engine applies it to opens only)
min_trade_interval_seconds: 30   # (unused by the engine)
max_child_order_pct: 0.5    # default 0.25 slices a 0.55 long into 3 children = 3x API calls; 0.5 -> 2
max_gross_exposure: 1.0     # RESEARCH.md hand-off: 1.0 (strategy itself caps gross at 0.98)
max_net_exposure: 1.0
max_per_symbol_exposure: 0.60   # comp k=3 inverse-vol: max single weight 0.552 in 2024-26 (p99 0.506)
max_positions: 20
max_effective_leverage: 1.0 # (unused by the engine; set for documentation)
min_cash_reserve_usd: 200.0 # risk check rejects the WHOLE plan if cash after fees < this
max_total_short_collateral_usd: 100000.0   # >= 50k (default 10k would reject every rebalance)
max_daily_loss_usd: 1.0e9   # no daily-loss brake (brakes reduced value in testing)
max_drawdown_pct: 1.0       # no drawdown brake
stale_data_seconds: 60      # (unused by the engine)
spread_guard_pct: 0.02      # (unused by the engine)
price_deviation_pct: 0.05   # (unused by the engine)
fat_finger_limit_pct: 0.2   # (unused by the engine)
max_order_value_usd: 100000.0   # per-symbol plan amount; 25k default would block any 0.25+ weight
short_collateral_mode: auto
strategy_poll_interval_seconds: 60   # >= 60 s: ~10 HTTP calls per idle loop
equity_snapshot_interval_seconds: 300
heart_beat_interval_seconds: 60
fill_timeout_seconds: 900   # passive limits rest ~one 15m bar, then cancelled and re-quoted
pending_short_ttl_seconds: 900
