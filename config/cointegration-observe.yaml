# Account-runner example: decisions only; no cointegration order execution.
# Set cycle_start before using. Reference capital is virtual, not a live allocation.
live:
  strategies: [cointegration-pairs]
  state_dir: var/pairs-observation
  market_store_dir: var/market
market_making:
  enabled: true  # selects the existing shared-account host; MM is not in the roster
  rxm_state_dir: var/no-legacy-import
cointegration:
  execution: observe
  intended_order_type: MARKET
  reference_capital: 10000
  cycle_start: "2026-10-01T00:00:00Z"  # e.g. "2026-10-10T00:00:00Z"; choose deliberately
  cycle_end: "2026-10-08T20:00:00Z"    # choose start + 14 days to reproduce independent research cycles
