# Primary live profile: cointegration only, with the full reconciled account allocated
# to cointegration pair owners. RXM and market making remain benched.

execution:
  live_mode: false
  dry_run: true
  strategy_poll_interval_seconds: 60
  max_gross_exposure: 1.0
  max_net_exposure: 1.0
  max_per_symbol_exposure: 1.0
  min_cash_reserve_usd: 200.0
  max_total_short_collateral_usd: 100000.0
  max_order_value_usd: 100000.0

live:
  strategies: [cointegration-pairs]
  strategy: cointegration-pairs
  mode: comp
  state_dir: var/cointegration-live
  market_store_dir: var/market
  market_store_retention_days: 30
  market_store_min_free_gb: 1.0
  guard:
    max_symbol_weight: 1.0
    warn_symbol_weight: 0.90
    max_order_frac_equity: 0.51
    max_order_notional_usd: 100000.0
    lockin_return: 0.0

market_making:
  enabled: false
  capital:
    mm_fraction: 0.0
  rxm_state_dir: var/bench-rxm

cointegration:
  execution: execute
  intended_order_type: MARKET
  reference_capital: 10000
  cycle_start: "2026-10-09T00:00:00Z"
  cycle_end: "2026-10-23T00:00:00Z"
